<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="{% url 'updateEmployee' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{Employee.id}}">
    <div>
      <label for="eno">Employee Number</label>

    </div>
    <div>
      <input  name="eno" id="eno" value="{{Employee.eno}}">
    </div>
    <div>
      <label for="ename">Employee name</label>

    </div>
    <div>
      <input  name="ename" id="ename" value="{{Employee.ename}}">
    </div>
    <div>
      <label for="esal">Employee sale</label>

    </div>
    <div>
      <input  name="esal" id="esal" value="{{Employee.esal}}">
    </div>
    <div>
      <input type="submit"  value="update">
    </div>

  </form>
  
</body>
</html>
