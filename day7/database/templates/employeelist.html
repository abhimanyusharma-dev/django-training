<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee list</title>
</head>
<body>
    <div>
        <h1>Employee list</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Employee number</th>
                <th>Enployee name </th>
                <th>Employee Salary</th>
            </tr>
            {% for i in Employees %}
            <tr>
            <td><a href="http://localhost:8000/database/updateEmployeeform/?id={{i.id}}">{{i.id}}</a></td>
            <td>{{i.eno}}</td>
            <td>{{i.ename}}</td>
            <td>{{i.sal}}</td>
            <td><a href="http://localhost:8000/database/deleteEmployee/?id={{i.id}}">delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
