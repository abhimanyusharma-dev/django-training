<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Student ID:</label>

        <input
            type="number"
            name="sid"
            required
        >

        <br><br>


        <label>Student Name:</label>

        <input
            type="text"
            name="sname"
            required
        >

        <br><br>


        <label>Student Branch:</label>

        <input
            type="text"
            name="sbranch"
            required
        >

        <br><br>


        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
