<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
</head>

<body>

    <h1>Signup</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Username:</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password:</label>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Signup
        </button>

    </form>

    <br>

    <a href="{% url 'login' %}">
        Already have an account? Login
    </a>

</body>
</html>
